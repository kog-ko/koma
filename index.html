<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="description" content="Analog art, digital art and game development by Kody.">
  <title>koma</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0d0d'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='700' font-size='22' fill='%23fff' text-anchor='middle'%3Ek%3C/text%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d0d;
      --tile: #1a1a1a;
      --fg: #f4f4f2;
      --dim: #8d8d8d;
      --line: #2a2a2a;
      --gap: 6px;
      --pad: 12px;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    body.locked { overflow: hidden; }

    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

    /* ── Top bar ── */
    .bar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px var(--pad);
      padding-top: calc(10px + env(safe-area-inset-top));
      background: rgba(13, 13, 13, .92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      color: inherit;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.03em;
      flex: none;
    }
    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-left: auto;
      -webkit-overflow-scrolling: touch;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex: none;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid #3a3a3a;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--fg);
      transition: background .15s, color .15s, border-color .15s;
    }
    .chip small { color: var(--dim); font-weight: 500; margin-left: 5px; font-size: 12px; }
    .chip:hover { border-color: var(--fg); }
    .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .chip[aria-pressed="true"] small { color: #555; }

    @media (max-width: 639px) {
      .bar { flex-wrap: wrap; gap: 8px; }
      .filters { margin-left: 0; width: 100%; }
      .chip { flex: 1; padding: 0 8px; }
    }
    @media (max-width: 479px) { .chip small { display: none; } }

    /* ── Grid ── */
    main { padding: var(--gap) var(--gap) 0; }
    .grid { column-count: 2; column-gap: var(--gap); }
    @media (min-width: 640px)  { .grid { column-count: 3; } }
    @media (min-width: 1000px) { .grid { column-count: 4; } }
    @media (min-width: 1500px) { .grid { column-count: 5; } }

    .tile {
      display: block;
      position: relative;
      width: 100%;
      margin-bottom: var(--gap);
      break-inside: avoid;
      background: var(--tile);
      overflow: hidden;
      cursor: zoom-in;
    }
    .tile img, .tile video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .tile .cap {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 28px 10px 8px;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      background: linear-gradient(transparent, rgba(0,0,0,.7));
      opacity: 0;
      transition: opacity .15s;
      pointer-events: none;
    }
    @media (hover: hover) { .tile:hover .cap { opacity: 1; } }
    .badge {
      position: absolute;
      top: 6px; left: 6px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      background: rgba(0,0,0,.65);
      border-radius: 3px;
      pointer-events: none;
    }

    .empty { padding: 4rem 1rem; text-align: center; color: var(--dim); display: none; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 22px var(--pad) calc(28px + env(safe-area-inset-bottom));
      color: var(--dim);
      font-size: 13px;
    }
    .top { color: var(--fg); font-weight: 600; }

    /* ── Viewer ── */
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      flex-direction: column;
      background: #000;
      touch-action: pan-y pinch-zoom;
    }
    .viewer.open { display: flex; }
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage img, .stage video { max-width: 100%; max-height: 100%; object-fit: contain; }
    .viewer-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(6px + env(safe-area-inset-top)) 6px 6px 14px;
      background: linear-gradient(rgba(0,0,0,.6), transparent);
      pointer-events: none;
    }
    .viewer-top > * { pointer-events: auto; }
    .count { font-size: 13px; color: #bbb; font-variant-numeric: tabular-nums; }
    .icon-btn {
      width: 48px; height: 48px;
      display: grid; place-items: center;
      font-size: 26px;
      line-height: 1;
      border-radius: 50%;
    }
    .icon-btn:hover { background: rgba(255,255,255,.12); }
    .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 56px; height: 72px; font-size: 38px; }
    .nav-arrow.prev { left: 4px; }
    .nav-arrow.next { right: 4px; }
    @media (max-width: 800px), (hover: none) { .nav-arrow { display: none; } }
    .viewer-info {
      padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: baseline;
      background: #000;
    }
    .viewer-title { font-weight: 700; font-size: 16px; }
    .viewer-meta { color: var(--dim); font-size: 13px; white-space: nowrap; }
  </style>
</head>
<body>

  <header class="bar">
    <a class="brand" href="#" id="brand" aria-label="koma — all work">koma</a>
    <nav class="filters" id="filters" aria-label="Filter work"></nav>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty">Nothing here yet.</p>
  </main>

  <footer>
    <span id="foot-count"></span>
    <button class="top" id="to-top">Back to top &uarr;</button>
  </footer>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Artwork viewer">
    <div class="viewer-top">
      <span class="count" id="v-count"></span>
      <button class="icon-btn" id="v-close" aria-label="Close">&times;</button>
    </div>
    <div class="stage" id="stage">
      <button class="icon-btn nav-arrow prev" id="v-prev" aria-label="Previous">&lsaquo;</button>
      <button class="icon-btn nav-arrow next" id="v-next" aria-label="Next">&rsaquo;</button>
    </div>
    <div class="viewer-info">
      <span class="viewer-title" id="v-title"></span>
      <span class="viewer-meta" id="v-meta"></span>
    </div>
  </div>

  <script src="artwork.js"></script>
  <script>
    const CATEGORIES = {
      'analog':   'Analog',
      'digital':  'Digital',
      'game-dev': 'Game Dev'
    };
    const isVideo = p => p.medium === 'Video';

    const pieces = typeof artwork === 'undefined' ? [] : artwork;
    let filter = 'all';
    let list = [];
    let viewing = -1;

    const $ = id => document.getElementById(id);
    const grid = $('grid'), viewer = $('viewer'), stage = $('stage');

    // ── Filters ──
    function renderFilters() {
      const counts = { all: pieces.length };
      pieces.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
      const items = [['all', 'All'], ...Object.entries(CATEGORIES)];
      $('filters').innerHTML = items.map(([key, label]) =>
        `<button class="chip" data-f="${key}" aria-pressed="${key === filter}">${label}<small>${counts[key] || 0}</small></button>`
      ).join('');
    }

    function filterFromHash() {
      const h = location.hash.replace('#', '');
      return CATEGORIES[h] ? h : 'all';
    }

    function setFilter(f, scroll) {
      filter = f;
      list = f === 'all' ? pieces : pieces.filter(p => p.category === f);
      document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.f === f));
      renderGrid();
      if (scroll) window.scrollTo({ top: 0 });
    }

    // ── Grid ──
    const videoObserver = 'IntersectionObserver' in window
      ? new IntersectionObserver(entries => {
          entries.forEach(e => {
            const v = e.target;
            if (e.isIntersecting) {
              if (!v.src) v.src = v.dataset.src;
              v.play().catch(() => {});
            } else {
              v.pause();
            }
          });
        }, { rootMargin: '200px' })
      : null;

    function renderGrid() {
      videoObserver && videoObserver.disconnect();
      $('empty').style.display = list.length ? 'none' : 'block';
      $('foot-count').textContent = `${list.length} piece${list.length !== 1 ? 's' : ''}`;

      grid.innerHTML = list.map((p, i) => {
        const ratio = p.w && p.h ? `aspect-ratio:${p.w}/${p.h}` : 'aspect-ratio:4/5';
        const media = isVideo(p)
          ? `<video data-src="${p.file}" muted loop playsinline preload="none" disablepictureinpicture></video>`
          : `<img src="${p.file}" alt="${p.title}" loading="lazy" decoding="async">`;
        const badge = filter === 'all' ? `<span class="badge">${CATEGORIES[p.category]}</span>` : '';
        return `<button class="tile" data-i="${i}" style="${ratio}" aria-label="Open ${p.title}">${media}${badge}<span class="cap">${p.title}</span></button>`;
      }).join('');

      grid.querySelectorAll('video').forEach(v => {
        if (videoObserver) videoObserver.observe(v);
        else { v.src = v.dataset.src; v.autoplay = true; }
      });
    }

    // ── Viewer ──
    function show(i) {
      viewing = (i + list.length) % list.length;
      const p = list[viewing];
      stage.querySelectorAll('img, video').forEach(n => n.remove());
      const el = isVideo(p) ? document.createElement('video') : document.createElement('img');
      if (isVideo(p)) { el.autoplay = true; el.loop = true; el.muted = true; el.playsInline = true; el.controls = true; }
      else el.alt = p.title;
      el.src = p.file;
      stage.insertBefore(el, stage.firstChild);
      $('v-title').textContent = p.title;
      $('v-meta').textContent = `${CATEGORIES[p.category]} · ${p.medium}`;
      $('v-count').textContent = `${viewing + 1} / ${list.length}`;
    }

    function openViewer(i) {
      show(i);
      viewer.classList.add('open');
      document.body.classList.add('locked');
      history.pushState({ viewer: true }, '');
    }

    function hideViewer() {
      viewer.classList.remove('open');
      document.body.classList.remove('locked');
      stage.querySelectorAll('video').forEach(v => v.pause());
      stage.querySelectorAll('img, video').forEach(n => n.remove());
      viewing = -1;
    }

    function closeViewer() {
      if (history.state && history.state.viewer) history.back();
      else hideViewer();
    }

    const step = d => { if (viewing >= 0) show(viewing + d); };

    // ── Events ──
    $('filters').addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      const f = chip.dataset.f;
      history.replaceState(null, '', f === 'all' ? location.pathname : '#' + f);
      setFilter(f, true);
    });
    $('brand').addEventListener('click', e => {
      e.preventDefault();
      history.replaceState(null, '', location.pathname);
      setFilter('all', true);
    });
    $('to-top').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    grid.addEventListener('click', e => {
      const tile = e.target.closest('.tile');
      if (tile) openViewer(+tile.dataset.i);
    });

    $('v-close').addEventListener('click', closeViewer);
    $('v-prev').addEventListener('click', () => step(-1));
    $('v-next').addEventListener('click', () => step(1));
    stage.addEventListener('click', e => { if (e.target === stage) closeViewer(); });

    window.addEventListener('popstate', () => {
      if (viewer.classList.contains('open') && !(history.state && history.state.viewer)) hideViewer();
      else if (!viewer.classList.contains('open')) setFilter(filterFromHash(), false);
    });

    document.addEventListener('keydown', e => {
      if (viewing < 0) return;
      if (e.key === 'Escape') closeViewer();
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'ArrowRight') step(1);
    });

    // Swipe left/right in the viewer
    let tx = 0, ty = 0;
    viewer.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
    viewer.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
      else if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.5) closeViewer();
    }, { passive: true });

    // ── Start ──
    filter = filterFromHash();
    renderFilters();
    setFilter(filter, false);
  </script>
</body>
</html>
