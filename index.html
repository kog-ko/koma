<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>koma studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,wght@0,300;0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --paper: #ece1cd;
      --paper-light: #f5edda;
      --ink: #2b2018;
      --accent: #b5613f;
      --serif: 'Instrument Serif', Georgia, serif;
      --body: 'Newsreader', Georgia, serif;
      --mono: 'Space Mono', ui-monospace, monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--body);
      background: radial-gradient(130% 70% at 50% -6%, var(--paper-light), var(--paper));
      background-attachment: fixed;
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      cursor: default;
    }

    body.intro-active { overflow: hidden; height: 100vh; }

    /* ── Custom Cursor ── */
    .cursor {
      width: 20px;
      height: 20px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transition: transform .15s ease, opacity .3s ease, width .3s ease, height .3s ease;
      transform: translate(-50%, -50%);
      opacity: 0;
    }
    .cursor.visible { opacity: 1; }
    .cursor.hover {
      width: 46px;
      height: 46px;
      background: rgba(181, 97, 63, 0.1);
    }
    .cursor-dot {
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity .3s ease;
    }
    .cursor-dot.visible { opacity: 1; }

    @media (max-width: 1024px) {
      .cursor, .cursor-dot { display: none; }
    }

    /* ── Intro ── */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(130% 70% at 50% -6%, var(--paper-light), var(--paper));
      transition: opacity .7s cubic-bezier(.4,0,.2,1), visibility .7s;
    }
    .intro.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .intro-mark {
      width: 84px;
      height: 84px;
      margin: 0 auto 1.4rem;
    }
    .intro-ring {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3;
      stroke-linecap: round;
      transform-origin: center;
      transform: rotate(-90deg);
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      animation: ringDraw 1.1s cubic-bezier(.4,0,.2,1) .2s forwards;
    }
    .intro-dot {
      fill: var(--accent);
      opacity: 0;
      transform-origin: center;
      transform: scale(0);
      animation: dotPop .5s cubic-bezier(.34,1.56,.64,1) 1.1s forwards;
    }
    .intro-word {
      font-family: var(--serif);
      font-size: 2.1rem;
      letter-spacing: .01em;
      color: var(--ink);
      text-align: center;
      opacity: 0;
      transform: translateY(14px);
      animation: introFade .7s ease 1.35s forwards;
    }
    .intro-word em { font-style: italic; color: var(--accent); }
    .intro-tag {
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(43,32,24,.45);
      text-align: center;
      margin-top: .9rem;
      opacity: 0;
      animation: introFade .6s ease 1.7s forwards;
    }

    @keyframes ringDraw { to { stroke-dashoffset: 0; } }
    @keyframes dotPop { to { opacity: 1; transform: scale(1); } }
    @keyframes introFade { to { opacity: 1; transform: translateY(0); } }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(242, 232, 213, .88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(43, 32, 24, .14);
      transform: translateY(-100%);
      animation: headerSlide .7s cubic-bezier(.4,0,.2,1) 2s forwards;
    }
    @keyframes headerSlide { to { transform: translateY(0); } }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.3rem 2.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .01em;
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
    }
    .logo em { font-style: italic; }

    nav { display: flex; gap: 1.5rem; align-items: center; }

    .nav-btn {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(43, 32, 24, .5);
      background: none;
      border: none;
      border-bottom: 1.5px solid transparent;
      padding-bottom: 2px;
      cursor: pointer;
      transition: color .3s ease, border-color .3s ease;
    }
    .nav-btn:hover { color: var(--ink); }
    .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Home Hero ── */
    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 5.5rem 2.75rem 2.2rem;
      position: relative;
    }
    .hero-stats {
      position: absolute;
      top: 5.5rem;
      right: 2.75rem;
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .1em;
      color: rgba(43, 32, 24, .5);
      text-align: right;
      line-height: 1.9;
      opacity: 0;
      animation: fadeUp .8s ease 2.3s forwards;
    }
    .hero h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(3rem, 8.2vw, 6.5rem);
      line-height: .96;
      letter-spacing: -.01em;
      max-width: 780px;
    }
    .hero h1 .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(60%);
      animation: wordReveal .9s cubic-bezier(.4,0,.2,1) forwards;
    }
    .hero h1 .word:nth-child(1) { animation-delay: 2.05s; }
    .hero h1 .word:nth-child(2) { animation-delay: 2.15s; }
    .hero h1 .word:nth-child(3) { animation-delay: 2.25s; }
    .hero h1 .word:nth-child(4) { animation-delay: 2.35s; }
    .hero h1 em { font-style: italic; color: var(--accent); }
    @keyframes wordReveal { to { opacity: 1; transform: translateY(0); } }

    .hero p {
      margin-top: 2.1rem;
      max-width: 420px;
      font-family: var(--mono);
      font-size: .8rem;
      line-height: 1.8;
      color: rgba(43, 32, 24, .62);
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp .8s ease 2.5s forwards;
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    /* ── Artist Header ── */
    .artist-header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4.6rem 2.75rem 2.2rem;
      display: none;
    }
    .artist-header.visible { display: block; }
    .back-link {
      display: inline-block;
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
      cursor: pointer;
      margin-bottom: 1.8rem;
      background: none;
      border: none;
    }
    .artist-name {
      font-family: var(--serif);
      font-size: clamp(2.6rem, 6vw, 4.6rem);
      line-height: .96;
    }
    .artist-role {
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: .6rem;
    }

    /* ── Gallery ── */
    .gallery-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.4rem 2.75rem 4.8rem;
      position: relative;
      z-index: 1;
    }

    .gallery-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 1.5rem;
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(43, 32, 24, .5);
    }

    .gallery {
      columns: 3;
      column-gap: 1.6rem;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 1.9rem;
      cursor: pointer;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity .6s cubic-bezier(.4,0,.2,1), transform .6s cubic-bezier(.4,0,.2,1);
    }
    .gallery-item.visible { opacity: 1; transform: translateY(0); }

    .thumb {
      position: relative;
      overflow: hidden;
      border-radius: 3px;
      transition: transform .3s ease, box-shadow .3s ease;
    }
    .gallery-item:hover .thumb {
      transform: translateY(-4px);
      box-shadow: 0 18px 34px -16px rgba(43, 32, 24, .5);
    }
    .thumb img, .thumb video {
      width: 100%;
      display: block;
    }

    .tag {
      position: absolute;
      top: 11px;
      left: 13px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .1em;
      color: rgba(255,255,255,.9);
      mix-blend-mode: difference;
    }

    .piece-title {
      margin-top: .6rem;
      font-family: var(--serif);
      font-size: 1.2rem;
      line-height: 1.1;
    }
    .piece-meta {
      margin-top: .2rem;
      font-family: var(--mono);
      font-size: .62rem;
      letter-spacing: .08em;
      color: rgba(43, 32, 24, .5);
    }

    .gallery.switching .gallery-item {
      opacity: 0;
      transform: translateY(20px);
    }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 6rem 2rem;
    }
    .empty-state .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.6rem;
      opacity: .5;
    }
    .empty-state h3 {
      font-family: var(--serif);
      font-size: 1.5rem;
      margin-bottom: .5rem;
    }
    .empty-state p {
      font-family: var(--mono);
      font-size: .75rem;
      color: rgba(43, 32, 24, .5);
      max-width: 300px;
      margin: 0 auto;
      line-height: 1.8;
    }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(28, 20, 13, 0);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      opacity: 0;
      visibility: hidden;
      transition: background .4s ease, opacity .4s ease, visibility .4s;
    }
    .lightbox.open {
      opacity: 1;
      visibility: visible;
      background: rgba(28, 20, 13, .93);
    }

    .lb-close, .lb-arrow {
      font-family: var(--mono);
      color: rgba(245, 237, 218, .8);
      cursor: pointer;
      background: none;
      border: none;
    }
    .lb-close {
      position: absolute;
      top: 1.6rem;
      right: 1.9rem;
      font-size: .72rem;
      letter-spacing: .1em;
    }
    .lb-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--serif);
      font-size: 2.8rem;
      padding: .7rem;
      color: rgba(245, 237, 218, .75);
      transition: color .2s ease;
    }
    .lb-arrow:hover { color: var(--paper-light); }
    .lb-prev { left: 1rem; }
    .lb-next { right: 1rem; }

    .lightbox-content {
      display: flex;
      max-width: 980px;
      width: 100%;
      max-height: 82vh;
      background: var(--paper);
      overflow: hidden;
      box-shadow: 0 40px 90px -24px rgba(0,0,0,.7);
      transform: translateY(10px) scale(.99);
      opacity: 0;
      transition: all .3s cubic-bezier(.4,0,.2,1);
    }
    .lightbox.open .lightbox-content {
      transform: none;
      opacity: 1;
      transition-delay: .1s;
    }

    .lb-media {
      flex: 1.25;
      min-height: 60vh;
      background: #dccdaf;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .lb-media img, .lb-media video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .lb-info {
      flex: 1;
      min-width: 260px;
      padding: 2.8rem 2.5rem;
      display: flex;
      flex-direction: column;
    }
    .lb-counter {
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .14em;
      color: var(--accent);
    }
    .lb-title {
      font-family: var(--serif);
      font-size: 2.6rem;
      line-height: 1.02;
      margin-top: 1.1rem;
    }
    .lb-meta {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(43, 32, 24, .55);
      margin-top: .7rem;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid rgba(43, 32, 24, .14);
    }
    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.9rem 2.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: .62rem;
      letter-spacing: .1em;
      color: rgba(43, 32, 24, .5);
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .gallery { columns: 2; }
      .hero-stats { position: static; margin-bottom: 2rem; text-align: left; animation: none; opacity: 1; }
      .hero { padding-top: 3.6rem; }
    }

    @media (max-width: 640px) {
      .gallery { columns: 1; }
      .header-inner { padding: 1rem 1.4rem; }
      .hero, .artist-header, .gallery-container { padding-left: 1.4rem; padding-right: 1.4rem; }
      .hero h1 { font-size: clamp(2.4rem, 11vw, 3.4rem); }
      nav { gap: 1rem; }
      .lightbox { padding: 0; }
      .lightbox-content { flex-direction: column; max-height: 100vh; height: 100%; border-radius: 0; }
      .lb-media { min-height: 42vh; }
      .lb-title { font-size: 1.8rem; }
      .lb-arrow { font-size: 2rem; }
    }
  </style>
</head>
<body class="intro-active">

  <!-- Intro -->
  <div class="intro" id="intro">
    <div style="text-align:center;">
      <svg class="intro-mark" viewBox="0 0 100 100">
        <circle class="intro-ring" cx="50" cy="50" r="35"></circle>
        <circle class="intro-dot" cx="50" cy="50" r="13"></circle>
      </svg>
      <div class="intro-word">koma <em>studio</em></div>
      <div class="intro-tag">A shared creative space</div>
    </div>
  </div>

  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursor-dot"></div>

  <!-- Header -->
  <header id="header">
    <div class="header-inner">
      <a class="logo" onclick="showTab('all')">koma <em>studio</em></a>
      <nav>
        <button class="nav-btn active" data-tab="all" onclick="showTab('all')">Works</button>
        <button class="nav-btn" data-tab="emma" onclick="showTab('emma')">Emma</button>
        <button class="nav-btn" data-tab="kody" onclick="showTab('kody')">Kody</button>
      </nav>
    </div>
  </header>

  <!-- Home Hero -->
  <section class="hero" id="hero">
    <div class="hero-stats" id="hero-stats"></div>
    <h1 id="hero-title">
      <span class="word">A</span>
      <span class="word">shared</span>
      <span class="word">creative</span>
      <span class="word"><em>space</em></span>
    </h1>
    <p id="hero-subtitle">The ongoing archive of Emma &amp; Kody's work, gathered in one place.</p>
  </section>

  <!-- Artist Header -->
  <section class="artist-header" id="artist-header">
    <button class="back-link" onclick="showTab('all')">&larr; All works</button>
    <div class="artist-name" id="artist-name"></div>
    <div class="artist-role" id="artist-role"></div>
  </section>

  <!-- Gallery -->
  <section class="gallery-container">
    <div class="gallery-header">
      <span id="gallery-label">Selected works</span>
      <span id="piece-count"></span>
    </div>
    <div class="gallery" id="gallery"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <svg class="mark" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="35" fill="none" stroke="var(--accent)" stroke-width="3"></circle>
        <circle cx="50" cy="50" r="13" fill="var(--accent)"></circle>
      </svg>
      <h3>No pieces yet</h3>
      <p>Add files to artwork/emma or artwork/kody and redeploy.</p>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="closeLightbox()">CLOSE &#10005;</button>
    <button class="lb-arrow lb-prev" onclick="stepLightbox(-1)">&lsaquo;</button>
    <button class="lb-arrow lb-next" onclick="stepLightbox(1)">&rsaquo;</button>
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <div class="lb-media">
        <img id="lightbox-img" src="" alt="">
        <video id="lightbox-video" muted loop playsinline style="display:none;"></video>
      </div>
      <div class="lb-info">
        <div class="lb-counter" id="lightbox-counter"></div>
        <div class="lb-title" id="lightbox-title"></div>
        <div class="lb-meta" id="lightbox-meta"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <span>KOMA STUDIO &mdash; EST. 2025</span>
      <span id="footer-count"></span>
    </div>
  </footer>

  <!-- Artwork data -->
  <script src="artwork.js"></script>

  <script>
    // ── State ──
    let allPieces = [];
    let currentList = [];
    let currentTab = 'all';
    let lightboxIndex = -1;
    let mouseX = 0, mouseY = 0, cursorX = 0, cursorY = 0;

    // ── Intro ──
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('intro').classList.add('hidden');
        document.body.classList.remove('intro-active');
      }, 2000);
    });

    // ── Custom Cursor ──
    const cursor = document.getElementById('cursor');
    const cursorDot = document.getElementById('cursor-dot');

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursorDot.style.left = mouseX + 'px';
      cursorDot.style.top = mouseY + 'px';
      cursor.classList.add('visible');
      cursorDot.classList.add('visible');
    });

    function animateCursor() {
      cursorX += (mouseX - cursorX) * 0.15;
      cursorY += (mouseY - cursorY) * 0.15;
      cursor.style.left = cursorX + 'px';
      cursor.style.top = cursorY + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    document.addEventListener('mouseleave', () => {
      cursor.classList.remove('visible');
      cursorDot.classList.remove('visible');
    });

    document.addEventListener('mouseover', (e) => {
      if (e.target.closest('.gallery-item, .nav-btn, .logo, button, a')) cursor.classList.add('hover');
    });
    document.addEventListener('mouseout', (e) => {
      if (e.target.closest('.gallery-item, .nav-btn, .logo, button, a')) cursor.classList.remove('hover');
    });

    // ── Intersection Observer ──
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

    // ── Load Pieces ──
    function loadPieces() {
      if (typeof artwork === 'undefined') {
        allPieces = [];
      } else {
        allPieces = artwork.map(piece => {
          const file = piece.file.toLowerCase();
          let mediaType = 'image';
          if (file.endsWith('.mp4') || file.endsWith('.mov') || file.endsWith('.webm')) mediaType = 'video';
          else if (file.endsWith('.gif')) mediaType = 'gif';
          return { ...piece, mediaType };
        });
      }
      renderStats();
      renderGallery();
    }

    function renderStats() {
      const year = new Date().getFullYear();
      const hands = new Set(allPieces.map(p => p.artist)).size;
      document.getElementById('hero-stats').innerHTML =
        `INDEX &middot; ${year}<br>${allPieces.length} WORK${allPieces.length !== 1 ? 'S' : ''}<br>${hands} ARTIST${hands !== 1 ? 'S' : ''}`;
      document.getElementById('footer-count').textContent =
        `${allPieces.length} WORK${allPieces.length !== 1 ? 'S' : ''} IN THE ARCHIVE`;
    }

    // ── Render Gallery ──
    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const emptyState = document.getElementById('empty-state');
      const countEl = document.getElementById('piece-count');
      const labelEl = document.getElementById('gallery-label');

      currentList = currentTab === 'all' ? allPieces : allPieces.filter(p => p.artist === currentTab);

      const labels = { all: 'Selected works', emma: "Emma's works", kody: "Kody's works" };
      labelEl.textContent = labels[currentTab];

      if (currentList.length === 0) {
        gallery.innerHTML = '';
        emptyState.style.display = 'block';
        countEl.textContent = '';
        return;
      }

      emptyState.style.display = 'none';
      countEl.textContent = `${currentList.length} piece${currentList.length !== 1 ? 's' : ''}`;

      gallery.innerHTML = currentList.map((piece, i) => {
        const code = piece.artist === 'emma' ? 'EM' : 'KO';
        const isVideo = piece.mediaType === 'video';
        return `
        <div class="gallery-item" onclick="openLightbox(${i})">
          <div class="thumb">
            ${isVideo
              ? `<video src="${piece.file}" muted loop playsinline autoplay></video>`
              : `<img src="${piece.file}" alt="${piece.title}" loading="lazy" />`}
            <span class="tag">${code}/${String(i + 1).padStart(2, '0')}</span>
          </div>
          <div class="piece-title">${piece.title}</div>
          <div class="piece-meta">${piece.artist.toUpperCase()} &middot; ${(piece.medium || '').toUpperCase()} &middot; ${piece.year}</div>
        </div>
      `;
      }).join('');

      document.querySelectorAll('.gallery-item').forEach((item, i) => {
        item.style.transitionDelay = `${i * 0.06}s`;
        observer.observe(item);
      });
    }

    // ── Tab Switching ──
    function showTab(tab) {
      if (tab === currentTab) return;

      const gallery = document.getElementById('gallery');
      gallery.classList.add('switching');

      setTimeout(() => {
        currentTab = tab;

        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === tab);
        });

        const hero = document.getElementById('hero');
        const artistHeader = document.getElementById('artist-header');

        if (tab === 'emma' || tab === 'kody') {
          hero.style.display = 'none';
          artistHeader.classList.add('visible');
          document.getElementById('artist-name').textContent = tab === 'emma' ? 'Emma' : 'Kody';
          document.getElementById('artist-role').textContent = tab === 'emma' ? 'Fine art & mixed media' : 'Digital art & illustration';
        } else {
          artistHeader.classList.remove('visible');
          hero.style.display = '';
        }

        renderGallery();
        gallery.classList.remove('switching');
      }, 250);
    }

    // ── Lightbox ──
    function openLightbox(index) {
      lightboxIndex = index;
      renderLightbox();
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function renderLightbox() {
      const piece = currentList[lightboxIndex];
      if (!piece) return;

      const isVideo = piece.mediaType === 'video';
      const imgEl = document.getElementById('lightbox-img');
      const videoEl = document.getElementById('lightbox-video');

      if (isVideo) {
        imgEl.style.display = 'none';
        videoEl.style.display = 'block';
        videoEl.src = piece.file;
        videoEl.play();
      } else {
        videoEl.style.display = 'none';
        videoEl.pause();
        videoEl.src = '';
        imgEl.style.display = 'block';
        imgEl.src = piece.file;
      }

      document.getElementById('lightbox-title').textContent = piece.title;
      document.getElementById('lightbox-meta').textContent =
        `${piece.artist.charAt(0).toUpperCase() + piece.artist.slice(1)} · ${piece.medium || ''} · ${piece.year}`;
      document.getElementById('lightbox-counter').textContent =
        `${String(lightboxIndex + 1).padStart(2, '0')} / ${String(currentList.length).padStart(2, '0')}`;
    }

    function stepLightbox(dir) {
      if (lightboxIndex === -1 || currentList.length === 0) return;
      lightboxIndex = (lightboxIndex + dir + currentList.length) % currentList.length;
      renderLightbox();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
      const videoEl = document.getElementById('lightbox-video');
      videoEl.pause();
      videoEl.src = '';
    }

    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target === document.getElementById('lightbox')) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') stepLightbox(-1);
      else if (e.key === 'ArrowRight') stepLightbox(1);
    });

    // ── Init ──
    loadPieces();
  </script>
</body>
</html>
